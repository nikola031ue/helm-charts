apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shop-operator.fullname" . }}-manager-role
  labels:
    app.kubernetes.io/name: shop-operator
    app.kubernetes.io/managed-by: Helm
rules:
- apiGroups:
  - shophub.io
  resources:
  - shops
  - shops/status
  - shops/finalizers
  - discordchannels
  - discordchannels/status
  - discordchannels/finalizers
  - wallets
  - wallets/status
  - wallets/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - app.redislabs.com
  resources:
  - redisenterprisedatabases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch