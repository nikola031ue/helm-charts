replicaCount: 1

image:
  repository: shop-api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  
resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: ConnectionStrings__DefaultConnection
    value: "Host=shop-postgres-service;Port=5432;Database=shopdb;Username=shop;Password=shop123"
  - name: ASPNETCORE_ENVIRONMENT
    value: "Development"
  - name: OpenTelemetry__OtlpEndpoint
    value: "http://otel-collector:4317"

postgresql:
  enabled: true
  dbName: shopdb
  dbUser: shop
  dbPassword: shop123
