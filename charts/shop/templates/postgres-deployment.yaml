apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shop.fullname" . }}-postgres
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
      {{- include "shop.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        {{- include "shop.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.dbName }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.dbUser }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.dbPassword }}